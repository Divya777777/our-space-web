# our-space-web: builds the app at the repo root and publishes it to GitHub Pages
# (https://<user>.github.io/<repo>/) on every push to main.
name: Deploy web app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  # Never cancel a running deploy: a cancelled one stays "in progress" on GitHub and blocks every later deploy.
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Served at the root of https://getourspace.com (custom domain, see public/CNAME).
          VITE_BASE: ${{ vars.VITE_BASE || '/' }}
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://our-space-stg.onrender.com' }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID || '351421523260-04n8q3b4g79ofjpins9sd4m12933b9rl.apps.googleusercontent.com' }}
          VITE_ANDROID_URL: ${{ vars.VITE_ANDROID_URL }}
          VITE_IOS_URL: ${{ vars.VITE_IOS_URL }}
          VITE_EXTENSION_URL: ${{ vars.VITE_EXTENSION_URL }}
          VITE_EXTENSION_ID: ${{ vars.VITE_EXTENSION_ID }}
          VITE_FIREFOX_EXTENSION_URL: ${{ vars.VITE_FIREFOX_EXTENSION_URL }}
      # GitHub Pages has no rewrites: serve the app for every path (room links, /join?code=…).
      - run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      # SEO: save the rendered front page into index.html (Google, Bing and link previews read real text), add FAQ
      # data, copy privacy/terms/support onto this domain and write sitemap.xml. Never blocks a deploy.
      - name: Prerender front page for search engines
        continue-on-error: true
        run: |
          npm i --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
          node scripts/prerender.mjs
        env:
          SITE_URL: https://getourspace.com
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://our-space-stg.onrender.com' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: pages
        uses: actions/deploy-pages@v4
      # Tell Bing (and Yandex, Seznam…) through IndexNow that the pages changed, so they re-crawl now instead of
      # waiting. The key file web/public/9f8d5cc9530c05038efbfbac00ca1dcb.txt proves we own the site. Never blocks a deploy.
      - name: Ping IndexNow (Bing)
        continue-on-error: true
        run: |
          sleep 60
          URLS=$(grep -o '<loc>[^<]*</loc>' dist/sitemap.xml | sed 's#</*loc>##g' | python3 -c 'import sys,json;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          curl -sS -o /dev/null -w "IndexNow: HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"getourspace.com\",\"key\":\"9f8d5cc9530c05038efbfbac00ca1dcb\",\"keyLocation\":\"https://getourspace.com/9f8d5cc9530c05038efbfbac00ca1dcb.txt\",\"urlList\":$URLS}"
