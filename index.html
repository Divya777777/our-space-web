    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://getourspace.com/#org",
          "name": "Our Space",
          "url": "https://getourspace.com/",
          "logo": "https://getourspace.com/icon-512.png",
          "sameAs": ["https://www.instagram.com/meetinourspace/"]
        },
        {
          "@type": "WebSite",
          "@id": "https://getourspace.com/#website",
          "name": "Our Space",
          "alternateName": ["Our Space app", "getourspace"],
          "url": "https://getourspace.com/",
          "publisher": { "@id": "https://getourspace.com/#org" }
        },
        {
          "@type": "WebApplication",
          "name": "Our Space",
          "url": "https://getourspace.com/",
          "description": "Private rooms to watch YouTube, Netflix, Prime Video and more in sync, video call while you watch, chat privately, play games for two and keep goals and plans together, from anywhere.",
          "applicationCategory": "SocialNetworkingApplication",
          "operatingSystem": "Web browser (Chrome, Edge, Firefox, Safari); Android app coming soon",
          "image": "https://getourspace.com/og-image.jpg",
          "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
          "publisher": { "@id": "https://getourspace.com/#org" },
          "featureList": [
            "Watch YouTube together in perfect sync: search or paste a link, play and pause for everyone",
            "Watch Netflix, Prime Video, Apple TV+, Disney+, HBO Max, Crunchyroll, JioHotstar, Sony LIV and ZEE5 together with the Our Space browser extension, each person on their own account",

            "Voice and video calls, one-to-one or the whole room, with faces floating over the video",
            "Floating picture-in-picture window that keeps playing while you do other things",
            "End-to-end encrypted private chat with photos and files up to 16 MB and sent, delivered and seen ticks",
            "Chat history kept on your own devices, backup to a folder you choose, and a QR code to copy chats to a computer",
            "Games for two: Scribble, Truth or Dare (sweet, fun or spicy) and How well do you know me, with monthly scores",
            "Shared goals with step counting, cheers, streaks and monthly records",
            "Plans for movie dates, study dates and playdates with reminders one hour before",
            "Private, invite-only rooms for couples, best friends and family far apart"
          ]
        }

    }
